# Keep heap modest on 8GB machines — 8G Xmx was killing Gradle mid-build
# and corrupting ~/.gradle/caches (metadata.bin errors).
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=true
